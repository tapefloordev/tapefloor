<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tape Floor</title>
  <link rel="stylesheet" href="./assets/floor.css" />
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1>TAPE FLOOR</h1>
      <nav class="links" aria-label="External">
        <a href="https://x.com/tapefloor1000x" rel="noopener noreferrer">@tapefloor1000x</a>
        <a href="https://github.com/tapefloordev/tapefloor" rel="noopener noreferrer">github</a>
      </nav>
    </header>

    <p class="disclaimer-bar" id="disclaimerTop">not a call · nfa</p>

    <!-- v2 pixel trading floor (above v1 table) -->
    <section class="floor-stage" aria-label="Trading floor">
      <div class="tape-strip" aria-hidden="true">
        <div class="tape-track" id="tapeTrack"></div>
      </div>

      <div class="floor-room">
        <div class="halt-lamp" id="haltLamp" title="Halt status">
          <span class="halt-bulb" aria-hidden="true"></span>
          <span id="haltLabel">HALT OFF</span>
        </div>

        <div class="desks">
          <button type="button" class="desk" data-seat="scout" id="desk-scout" aria-label="Scout desk">
            <div class="desk-art">
              <div class="worker" aria-hidden="true">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
              </div>
              <div class="monitor" aria-hidden="true"></div>
              <div class="desk-top" aria-hidden="true"></div>
              <div class="desk-body" aria-hidden="true"></div>
              <div class="chair" aria-hidden="true"></div>
            </div>
            <div class="desk-label">Scout</div>
            <div class="desk-status" id="status-scout">idle</div>
          </button>

          <button type="button" class="desk" data-seat="chief" id="desk-chief" aria-label="Chief desk">
            <div class="desk-art">
              <div class="worker" aria-hidden="true">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
              </div>
              <div class="monitor" aria-hidden="true"></div>
              <div class="desk-top" aria-hidden="true"></div>
              <div class="desk-body" aria-hidden="true"></div>
              <div class="chair" aria-hidden="true"></div>
            </div>
            <div class="desk-label">Chief</div>
            <div class="desk-status" id="status-chief">idle</div>
          </button>

          <button type="button" class="desk" data-seat="steno" id="desk-steno" aria-label="Steno desk">
            <div class="desk-art">
              <div class="worker" aria-hidden="true">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
              </div>
              <div class="monitor" aria-hidden="true"></div>
              <div class="desk-top" aria-hidden="true"></div>
              <div class="desk-body" aria-hidden="true"></div>
              <div class="chair" aria-hidden="true"></div>
            </div>
            <div class="desk-label">Steno</div>
            <div class="desk-status" id="status-steno">idle</div>
          </button>

          <button type="button" class="desk" data-seat="dev" id="desk-dev" aria-label="Dev desk">
            <div class="desk-art">
              <div class="worker" aria-hidden="true">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
              </div>
              <div class="monitor" aria-hidden="true"></div>
              <div class="desk-top" aria-hidden="true"></div>
              <div class="desk-body" aria-hidden="true"></div>
              <div class="chair" aria-hidden="true"></div>
            </div>
            <div class="desk-label">Dev</div>
            <div class="desk-status" id="status-dev">idle</div>
          </button>
        </div>
      </div>
    </section>

    <!-- Desk detail panel -->
    <aside class="panel" id="deskPanel" aria-live="polite">
      <div class="panel-head">
        <h2 id="panelTitle">Desk</h2>
        <button type="button" class="panel-close" id="panelClose">close</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>

    <!-- v1 watch table (fallback if art fails) -->
    <p class="v1-label">Watch table</p>
    <div class="card">
      <div class="meta" id="meta">Loading…</div>
      <div class="tape" id="tape"></div>
      <table>
        <thead><tr><th>Name</th><th>mc</th><th>vol</th><th>flag</th></tr></thead>
        <tbody id="names"></tbody>
      </table>
      <div id="stand"></div>
      <p class="disclaimer" id="disclaimer">not a call · nfa</p>
    </div>
  </div>

  <script>
    const SEATS = ['scout', 'chief', 'steno', 'dev'];
    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
    const SEAT_TITLES = { scout: 'Scout', chief: 'Chief', steno: 'Steno', dev: 'Dev' };

    const fmt = n => {
      if (typeof n !== 'number' || !isFinite(n)) return '—';
      if (n >= 1e9) return `$${(n / 1e9).toFixed(1)}B`;
      if (n >= 1e6) return `$${(n / 1e6).toFixed(1)}M`;
      if (n >= 1e3) return `$${(n / 1e3).toFixed(0)}K`;
      return `$${n}`;
    };

    const fmtMoney = n => {
      if (typeof n !== 'number' || !isFinite(n)) return '—';
      return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    };

    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    function fmtMT(iso) {
      if (!iso) return null;
      const t = new Date(iso);
      if (!isFinite(t.getTime())) return null;
      return t.toLocaleString('en-US', {
        timeZone: 'America/Denver',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }) + ' MT';
    }

    function humanFlag(f) {
      if (!f) return '';
      return String(f).replace(/_/g, ' ');
    }

    let watch = null;
    let journal = null;
    let xcardText = '';
    let deploy = null;
    const seatData = {};

    function isWorking(updated) {
      if (!updated) return false;
      const t = Date.parse(updated);
      if (!isFinite(t)) return false;
      return (Date.now() - t) <= TWO_HOURS_MS;
    }

    function setHalt(on) {
      const lamp = document.getElementById('haltLamp');
      const label = document.getElementById('haltLabel');
      if (on) {
        lamp.classList.add('on');
        label.textContent = 'HALT ON';
      } else {
        lamp.classList.remove('on');
        label.textContent = 'HALT OFF';
      }
    }

    function seatStamp(seat, data) {
      if (seat === 'dev') {
        return (data && (data.updated || data.pushed_at))
          || (deploy && deploy.pushed_at)
          || null;
      }
      return data && data.updated;
    }

    function applySeatStatus(seat, data) {
      const working = isWorking(seatStamp(seat, data));
      const btn = document.getElementById('desk-' + seat);
      const status = document.getElementById('status-' + seat);
      if (btn.classList.contains('away')) {
        btn.classList.remove('working');
        status.textContent = 'away';
        return;
      }
      if (working) {
        btn.classList.add('working');
        status.textContent = 'working';
      } else {
        btn.classList.remove('working');
        status.textContent = 'idle';
      }
    }

    function buildTapeMarquee(w) {
      const names = (w && w.names) || [];
      if (!names.length) return 'NO NAMES';
      // ticker text ONLY from watch.json names/flags — no invented prices/P&L
      const parts = names.map(n => {
        const flag = n.flag ? ` [${n.flag}]` : '';
        return `${n.ticker}${flag}`;
      });
      return parts.join('   ·   ') + '   ·   ';
    }

    function setTape(w) {
      const text = buildTapeMarquee(w);
      const track = document.getElementById('tapeTrack');
      // Rebuild two identical children so translateX(-50%) loops seamlessly
      track.innerHTML = '';
      for (let i = 0; i < 2; i++) {
        const span = document.createElement('span');
        span.className = 'tape-copy';
        span.textContent = text;
        track.appendChild(span);
      }
      track.style.animation = 'none';
      void track.offsetWidth;
      track.style.animation = '';
    }

    /* ——— v2.1 motion: night away + occasional desk→tape→desk walks ——— */
    const WALK_INTERVAL_MS = 4 * 60 * 1000;
    const WALK_DURATION_MS = 5000;
    let walkerBusy = false;
    let walkTimer = null;

    function denverHour() {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Denver',
        hour: 'numeric',
        hourCycle: 'h23'
      }).formatToParts(new Date());
      const h = parts.find(p => p.type === 'hour');
      return parseInt(h && h.value, 10) % 24;
    }

    function isNightDenver() {
      const h = denverHour();
      return h >= 23 || h < 7;
    }

    function isStandDownOrHalt() {
      return (watch && watch.stand_down === true) || (journal && journal.halt === true);
    }

    function applyNightAway() {
      const night = isNightDenver();
      SEATS.forEach(seat => {
        const btn = document.getElementById('desk-' + seat);
        let away = false;
        if (night) {
          if (seat === 'dev') {
            away = !isWorking(seatStamp('dev', seatData.dev));
          } else {
            away = true;
          }
        }
        if (away) {
          btn.classList.add('away');
          btn.classList.remove('walking');
        } else {
          btn.classList.remove('away');
        }
        applySeatStatus(seat, seatData[seat]);
      });
    }

    function eligibleWalkers() {
      if (walkerBusy || isStandDownOrHalt()) return [];
      return SEATS.filter(seat => {
        const btn = document.getElementById('desk-' + seat);
        return btn && !btn.classList.contains('away') && !btn.classList.contains('walking');
      });
    }

    function startWalk() {
      applyNightAway();
      const eligible = eligibleWalkers();
      if (!eligible.length) return;
      const seat = eligible[Math.floor(Math.random() * eligible.length)];
      const btn = document.getElementById('desk-' + seat);
      walkerBusy = true;
      btn.classList.add('walking');
      window.setTimeout(() => {
        btn.classList.remove('walking');
        walkerBusy = false;
      }, WALK_DURATION_MS);
    }

    function startMotionLoop() {
      applyNightAway();
      if (walkTimer) clearInterval(walkTimer);
      walkTimer = window.setInterval(startWalk, WALK_INTERVAL_MS);
      // first stroll shortly after load (still only if eligible)
      window.setTimeout(startWalk, 20000);
    }

    function renderV1(w) {
      const t = new Date(w.time);
      document.getElementById('meta').textContent =
        `WATCH · ${t.toLocaleString('en-US', {
          timeZone: 'America/Denver',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        })} MT`
        + (w.liquid_tape_day ? ' · liquid tape day' : '');

      const tape = w.tape || {};
      const sol = tape.SOL_24h_pct;
      const btc = tape.BTC_24h_pct;
      document.getElementById('tape').textContent =
        `SOL ${sol >= 0 ? '+' : ''}${sol}% · BTC ${btc >= 0 ? '+' : ''}${btc}% (${tape.source || ''})`;

      const rows = (w.names || []).map(n =>
        `<tr><td>${esc(n.ticker)}</td><td>mc ${fmt(n.mcap)}</td><td>vol ${fmt(n.vol24)}</td><td class="flag">${esc(n.flag || '')}</td></tr>`
      ).join('');
      document.getElementById('names').innerHTML =
        rows || '<tr><td colspan="4" class="err">No names in watch.json</td></tr>';

      const stand = document.getElementById('stand');
      if (w.stand_down) {
        stand.innerHTML = `<span class="stand">stand-down · ${esc(w.stand_down_why || 'yes')}</span>`;
      } else {
        stand.innerHTML = `<span class="stand">stand-down no</span>`;
      }

      const disc = w.disclaimer || 'not a call · nfa';
      document.getElementById('disclaimer').textContent = disc;
      document.getElementById('disclaimerTop').textContent = disc;
    }

    function statusLine(seat) {
      const btn = document.getElementById('desk-' + seat);
      if (btn && btn.classList.contains('away')) return 'Away';
      return isWorking(seatStamp(seat, seatData[seat])) ? 'Working' : 'Idle';
    }

    function disclaimerHtml() {
      const d = (watch && watch.disclaimer) || (journal && journal.disclaimer) || 'not a call · nfa';
      return `<p class="disclaimer">${esc(d)}</p>`;
    }

    async function loadXcard() {
      if (xcardText) return xcardText;
      try {
        const r = await fetch('./xcard.txt', { cache: 'no-store' });
        xcardText = r.ok ? await r.text() : '';
      } catch (e) {
        xcardText = '';
      }
      return xcardText;
    }

    async function openPanel(seat) {
      const panel = document.getElementById('deskPanel');
      const title = document.getElementById('panelTitle');
      const body = document.getElementById('panelBody');
      title.textContent = SEAT_TITLES[seat] || seat;

      const w = watch || {};
      const j = journal || {};
      let html = `<p class="panel-status">${statusLine(seat)}</p>`;

      if (seat === 'scout') {
        const when = fmtMT(w.time);
        html += `<p class="panel-line">Watch time · ${esc(when || '—')}</p>`;
        const names = w.names || [];
        if (names.length) {
          html += `<ul class="panel-names">`;
          names.forEach(n => {
            const flag = humanFlag(n.flag);
            html += `<li>${esc(n.ticker)} · mc ${fmt(n.mcap)} · vol ${fmt(n.vol24)}${flag ? ' · ' + esc(flag) : ''}</li>`;
          });
          html += `</ul>`;
        }
      } else if (seat === 'chief') {
        const book = j.book || {};
        const pos = book.position ? String(book.position) : '—';
        html += `<p class="panel-line">Halt: ${j.halt ? 'ON' : 'OFF'}</p>`;
        html += `<p class="panel-line">Open tickets: ${esc(j.open_tickets ?? 0)}</p>`;
        html += `<p class="panel-line">Book: paper ${fmtMoney(book.paper)} · live ${fmtMoney(book.live)} · ${esc(pos)}</p>`;
        html += `<p class="panel-line">Passed: ${esc(j.skipped ?? 0)}</p>`;
        html += `<p class="panel-line">Called: ${esc(j.called ?? 0)}</p>`;
        if (j.time) {
          html += `<p class="panel-line">Time: ${esc(fmtMT(j.time) || j.time)}</p>`;
        }
        if (j.source) {
          html += `<p class="panel-line">Source: ${esc(j.source)}</p>`;
        }
      } else if (seat === 'steno') {
        const card = await loadXcard();
        html += `<div class="panel-section"><h3>Last X card</h3>`;
        html += `<pre class="xcard">${esc(card)}</pre></div>`;
      } else if (seat === 'dev') {
        const pushed = (deploy && deploy.pushed_at) || (seatData.dev && seatData.dev.pushed_at);
        html += `<p class="panel-line"><a href="https://github.com/tapefloordev/tapefloor" rel="noopener noreferrer">https://github.com/tapefloordev/tapefloor</a></p>`;
        html += `<p class="panel-line">Last push: ${esc(fmtMT(pushed) || '—')}</p>`;
      }

      html += disclaimerHtml();
      body.innerHTML = html;
      panel.classList.add('open');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closePanel() {
      document.getElementById('deskPanel').classList.remove('open');
    }

    document.getElementById('panelClose').addEventListener('click', closePanel);
    SEATS.forEach(seat => {
      document.getElementById('desk-' + seat).addEventListener('click', () => { openPanel(seat); });
    });

    Promise.all([
      fetch('./watch.json', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('watch.json ' + r.status);
        return r.json();
      }),
      fetch('./journal.json', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('journal.json ' + r.status);
        return r.json();
      }),
      fetch('./xcard.txt', { cache: 'no-store' })
        .then(r => (r.ok ? r.text() : ''))
        .catch(() => ''),
      fetch('./deploy.json', { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null),
      ...SEATS.map(seat =>
        fetch(`./seats/${seat}.json`, { cache: 'no-store' })
          .then(r => (r.ok ? r.json() : { updated: null }))
          .catch(() => ({ updated: null }))
          .then(d => { seatData[seat] = d; })
      )
    ])
      .then(([w, j, xcard, dep]) => {
        watch = w;
        journal = j;
        xcardText = xcard || '';
        deploy = dep;

        // Halt lamp: ON iff journal.halt===true OR watch.stand_down===true
        setHalt(j.halt === true || w.stand_down === true);

        setTape(w);

        SEATS.forEach(seat => applySeatStatus(seat, seatData[seat]));
        applyNightAway();
        startMotionLoop();
        renderV1(w);
      })
      .catch(e => {
        document.getElementById('meta').innerHTML = `<span class="err">Failed to load watch.json / journal.json</span>`;
        console.error(e);
      });
  </script>
</body>
</html>
