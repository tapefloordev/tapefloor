  <script>
    // Day: Scout/Chief/Steno/Dev seated; Trader from trader.json; open empty.
    // Night 23:00–07:00 MT: Scout/Chief/Steno empty chairs; Trader empty until seat rule; Dev stays only if recent push.
    const SEATS = ['scout', 'chief', 'steno', 'dev'];
    const EMPTY_DESKS = ['trader', 'open'];
    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
    const SEAT_TITLES = {
      scout: 'Scout',
      chief: 'Chief',
      steno: 'Steno',
      dev: 'Dev',
      trader: 'Trader',
      open: 'open'
    };

    const fmt = n => {
      if (typeof n !== 'number' || !isFinite(n)) return '—';
      if (n >= 1e9) return `$${(n / 1e9).toFixed(1)}B`;
      if (n >= 1e6) return `$${(n / 1e6).toFixed(1)}M`;
      if (n >= 1e3) return `$${(n / 1e3).toFixed(0)}K`;
      return `$${n}`;
    };

    const fmtMoney = n => {
      if (typeof n !== 'number' || !isFinite(n)) return '—';
      return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    };

    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    function fmtMT(iso) {
      if (!iso) return null;
      const t = new Date(iso);
      if (!isFinite(t.getTime())) return null;
      return t.toLocaleString('en-US', {
        timeZone: 'America/Denver',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }) + ' MT';
    }

    function humanFlag(f) {
      if (!f) return '';
      return String(f).replace(/_/g, ' ');
    }

    let watch = null;
    let journal = null;
    let xcardText = '';
    let deploy = null;
    let trader = null;
    const seatData = {};

    function isWorking(updated) {
      if (!updated) return false;
      const t = Date.parse(updated);
      if (!isFinite(t)) return false;
      return (Date.now() - t) <= TWO_HOURS_MS;
    }

    function setHalt(on) {
      const lamp = document.getElementById('haltLamp');
      const label = document.getElementById('haltLabel');
      if (on) {
        lamp.classList.add('on');
        label.textContent = 'HALT ON';
      } else {
        lamp.classList.remove('on');
        label.textContent = 'HALT OFF';
      }
    }

    function journalEntries(j) {
      return (j && Array.isArray(j.entries)) ? j.entries : [];
    }

    function countPassedNames(j) {
      // Prefer cycle counts from journal root when Chief sets them (X-style skipped N).
      if (j && j.skipped != null && isFinite(Number(j.skipped))) return Number(j.skipped);
      let n = 0;
      for (const e of journalEntries(j)) {
        const t = e && String(e.type || '').toUpperCase();
        if (t !== 'PASS' && t !== 'SKIP') continue;
        if (Array.isArray(e.names)) n += e.names.length;
      }
      return n;
    }

    function countCalled(j) {
      if (j && j.called != null && isFinite(Number(j.called))) return Number(j.called);
      let n = 0;
      for (const e of journalEntries(j)) {
        if (!e || String(e.type || '').toUpperCase() !== 'CALL') continue;
        if (Array.isArray(e.names) && e.names.length) n += e.names.length;
        else n += 1;
      }
      return n;
    }

    function publicEntryType(typ) {
      // Public UI: never render "pass" — PASS/SKIP → Skipped
      const t = String(typ || 'LOG').toUpperCase();
      if (t === 'PASS' || t === 'SKIP') return 'Skipped';
      if (t === 'CALL') return 'Called';
      if (t === 'WATCH') return 'Watch';
      if (t === 'BRIEF') return 'Brief';
      if (t === 'DRAFT') return 'Draft';
      if (t === 'OPEN') return 'Paper open';
      if (t === 'CLOSE') return 'Close';
      return t.charAt(0) + t.slice(1).toLowerCase();
    }


    function journalPaperPnlUsd(j) {
      if (!j) return 0;
      return toPnlNumber(firstPresent(j, ['paper_pnl_usd', 'paper_pnl', 'pnl.paper']));
    }

    function journalLivePnlUsd(j) {
      if (!j) return 0;
      return toPnlNumber(firstPresent(j, ['live_pnl_usd', 'live_pnl', 'pnl.live']));
    }

    function journalPaperPnlSol(j) {
      if (!j) return 0;
      return toPnlNumber(firstPresent(j, ['paper_pnl_sol', 'pnl.paper_sol']));
    }

    function journalLivePnlSol(j) {
      if (!j) return 0;
      return toPnlNumber(firstPresent(j, ['live_pnl_sol', 'pnl.live_sol']));
    }

    function fmtPnlSolUsd(sol, usd) {
      // P&L display SOL+USD; missing → 0. No animation.
      const s = (typeof sol === 'number' && isFinite(sol)) ? sol : 0;
      const u = (typeof usd === 'number' && isFinite(usd)) ? usd : 0;
      const solTxt = (s === 0 ? '0' : (s > 0 ? '+' : '') + s.toLocaleString('en-US', { maximumFractionDigits: 4 })) + ' SOL';
      return solTxt + ' (' + fmtPnlUsd(u) + ')';
    }

    // Back-compat aliases used elsewhere
    function journalPaperPnl(j) { return journalPaperPnlUsd(j); }
    function journalLivePnl(j) { return journalLivePnlUsd(j); }

    function renderWhiteboard(j, w) {
      // Human labels only — no fake book / invented wins.
      // Halt: j.halt if present else OFF. Stand-down: j then watch.
      // Paper/Live P&L from journal fields. Skipped/Called from LOG entries (PASS→Skipped).
      let standDown = false;
      if (j && Object.prototype.hasOwnProperty.call(j, 'stand_down')) {
        standDown = !!j.stand_down;
      } else if (w && Object.prototype.hasOwnProperty.call(w, 'stand_down')) {
        standDown = !!w.stand_down;
      }
      const haltOn = !!(j && j.halt === true);
      const lines = [
        ['Halt', haltOn ? 'ON' : 'OFF'],
        ['Stand-down', standDown ? 'yes' : 'no'],
        ['Paper book', ((j && j.paper_book_sol) != null ? Number(j.paper_book_sol) : 1).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' SOL'],
        ['Paper P&L', fmtPnlSolUsd(journalPaperPnlSol(j), journalPaperPnlUsd(j))],
        ['Live P&L', fmtPnlSolUsd(0, 0)],
        ['Skipped', String(countPassedNames(j))],
        ['Called', String(countCalled(j))]
      ];
      const ul = document.getElementById('whiteboardLines');
      ul.innerHTML = lines.map(([k, v]) =>
        `<li><span class="wb-k">${esc(k)}</span><span class="wb-v">${esc(v)}</span></li>`
      ).join('');
      if (typeof refreshWallZoomIfOpen === 'function') refreshWallZoomIfOpen('board');
    }

    function firstPresent(obj, paths) {
      if (!obj) return undefined;
      for (const path of paths) {
        const parts = path.split('.');
        let cur = obj;
        let ok = true;
        for (const p of parts) {
          if (cur == null || !Object.prototype.hasOwnProperty.call(cur, p)) {
            ok = false;
            break;
          }
          cur = cur[p];
        }
        if (ok && cur !== undefined && cur !== null) return cur;
      }
      return undefined;
    }

    function hasClosedTicket(j) {
      if (!j) return false;
      // New LOG: any CLOSE entry unlocks TV P&L fields.
      for (const e of journalEntries(j)) {
        if (e && e.type === 'CLOSE') return true;
      }
      // Legacy shapes
      const ct = firstPresent(j, ['closed_tickets']);
      if (typeof ct === 'number' && isFinite(ct) && ct > 0) return true;
      const closed = firstPresent(j, ['closed']);
      if (typeof closed === 'number' && isFinite(closed) && closed > 0) return true;
      if (Array.isArray(closed) && closed.length > 0) return true;
      const tc = firstPresent(j, ['tickets_closed']);
      if (typeof tc === 'number' && isFinite(tc) && tc > 0) return true;
      return false;
    }

    function toPnlNumber(v) {
      if (typeof v === 'number' && isFinite(v)) return v;
      if (typeof v === 'string' && v.trim() !== '') {
        const n = Number(v);
        if (isFinite(n)) return n;
      }
      return 0;
    }

    function fmtPnlUsd(n) {
      const v = typeof n === 'number' && isFinite(n) ? n : 0;
      const abs = Math.abs(v);
      const body = abs.toLocaleString('en-US', { maximumFractionDigits: 0 });
      return (v < 0 ? '-$' : '$') + body;
    }

    function isLiveClose(e) {
      if (!e || typeof e !== 'object') return false;
      if (e.live === true || e.book === 'live' || e.mode === 'live') return true;
      const lane = String(e.lane || '').toUpperCase();
      return lane === 'LIVE';
    }

    function paperEquityPoints(j) {
      // Start 1.00 SOL, then each paper CLOSE. Prefer entry.book_after (Alex lock); else sum pnl_sol.
      const startRaw = j && (j.paper_book_start_sol != null ? j.paper_book_start_sol : j.book_start_sol);
      const start = (startRaw != null && isFinite(Number(startRaw))) ? Number(startRaw) : 1;
      const closes = journalEntries(j)
        .filter(e => e && String(e.type || '').toUpperCase() === 'CLOSE' && !isLiveClose(e))
        .slice()
        .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
      const pts = [{ book: start, kind: 'start' }];
      let book = start;
      for (const e of closes) {
        let next = NaN;
        if (e.book_after != null && e.book_after !== '' && isFinite(Number(e.book_after))) {
          next = Number(e.book_after);
        } else {
          const pnl = e.pnl_sol != null ? Number(e.pnl_sol) : NaN;
          if (!isFinite(pnl)) continue;
          next = Math.round((book + pnl) * 1e6) / 1e6;
        }
        book = next;
        pts.push({
          book,
          kind: 'close',
          time: e.time || null,
          name: (Array.isArray(e.names) && e.names[0]) ? String(e.names[0]) : 'CLOSE'
        });
      }
      return pts;
    }

    function liveEquityPoints(j) {
      // Only if live CLOSEs exist — no flat filler path.
      const closes = journalEntries(j)
        .filter(e => e && String(e.type || '').toUpperCase() === 'CLOSE' && isLiveClose(e))
        .slice()
        .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
      if (!closes.length) return [];
      const startRaw = j && j.live_book_start_sol;
      const start = (startRaw != null && isFinite(Number(startRaw))) ? Number(startRaw) : 0;
      const pts = [{ book: start, kind: 'start' }];
      let book = start;
      for (const e of closes) {
        const pnl = e.pnl_sol != null ? Number(e.pnl_sol) : NaN;
        if (!isFinite(pnl)) continue;
        book = Math.round((book + pnl) * 1e6) / 1e6;
        pts.push({ book, kind: 'close', time: e.time || null });
      }
      return pts;
    }

    function appendEquityPath(svg, points, className, yMin, yMax) {
      if (!svg || !points || points.length < 2) return;
      const w = 120, h = 28, padX = 4, padY = 4;
      let min = yMin, max = yMax;
      if (min === max) { min -= 0.01; max += 0.01; }
      const span = max - min;
      const n = points.length;
      const coords = points.map((p, i) => {
        const x = padX + (i / (n - 1)) * (w - padX * 2);
        const y = padY + (1 - (p.book - min) / span) * (h - padY * 2);
        return { x, y };
      });
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke-width', '1.25');
      poly.setAttribute('stroke-linejoin', 'round');
      poly.setAttribute('stroke-linecap', 'round');
      poly.setAttribute('points', coords.map(c => c.x.toFixed(2) + ',' + c.y.toFixed(2)).join(' '));
      poly.setAttribute('class', className);
      svg.appendChild(poly);
      coords.forEach(c => {
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', c.x.toFixed(2));
        dot.setAttribute('cy', c.y.toFixed(2));
        dot.setAttribute('r', '1.6');
        dot.setAttribute('class', className + '-dot');
        svg.appendChild(dot);
      });
    }

    function renderTvEquity(j) {
      const svg = document.getElementById('tvEquity');
      const wrap = document.getElementById('tvEquityWrap');
      if (!svg || !wrap) return;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const paperPts = paperEquityPoints(j);
      const livePts = liveEquityPoints(j);
      const drawPaper = paperPts.length >= 2;
      const drawLive = livePts.length >= 2;
      const show = drawPaper || drawLive;
      wrap.hidden = !show;
      wrap.setAttribute('aria-hidden', show ? 'false' : 'true');
      if (!show) return;
      const books = [];
      if (drawPaper) paperPts.forEach(p => books.push(p.book));
      if (drawLive) livePts.forEach(p => books.push(p.book));
      const yMin = Math.min.apply(null, books);
      const yMax = Math.max.apply(null, books);
      if (drawPaper) appendEquityPath(svg, paperPts, 'tv-eq-paper', yMin, yMax);
      if (drawLive) appendEquityPath(svg, livePts, 'tv-eq-live', yMin, yMax);
      const last = drawPaper ? paperPts[paperPts.length - 1] : livePts[livePts.length - 1];
      svg.setAttribute('aria-label', 'Paper book ' + (last ? Number(last.book).toFixed(4) : '—') + ' SOL');
    }

    function renderTv(j) {
      // Gate: only show non-zero journal P&L after a real CLOSE (or legacy closed).
      // Missing / no CLOSE → $0. No animation.
      let paper = 0;
      let live = 0;
      if (hasClosedTicket(j)) {
        paper = journalPaperPnl(j);
        live = journalLivePnl(j);
      }
      document.getElementById('tvPaper').textContent = 'Paper P&L: ' + fmtPnlUsd(paper);
      document.getElementById('tvLive').textContent = 'Live P&L: ' + fmtPnlUsd(live);
      renderTvEquity(j);
      if (typeof refreshWallZoomIfOpen === 'function') refreshWallZoomIfOpen('tv');
    }

    function denverParts(date) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Denver',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(date);
      const get = t => parts.find(p => p.type === t).value;
      return {
        year: parseInt(get('year'), 10),
        month: parseInt(get('month'), 10),
        day: parseInt(get('day'), 10),
        hour: parseInt(get('hour'), 10) % 24,
        minute: parseInt(get('minute'), 10),
        second: parseInt(get('second'), 10)
      };
    }

    function denverDateKey(date) {
      const p = denverParts(date);
      return p.year + '-' + String(p.month).padStart(2, '0') + '-' + String(p.day).padStart(2, '0');
    }

    // Build a Date for America/Denver wall-clock Y-M-D H:M:S via iterative offset.
    function denverWallTime(year, month, day, hour, minute, second) {
      const utcGuess = Date.UTC(year, month - 1, day, hour, minute, second || 0);
      let t = utcGuess;
      for (let i = 0; i < 3; i++) {
        const p = denverParts(new Date(t));
        const asUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
        const want = Date.UTC(year, month - 1, day, hour, minute, second || 0);
        t += want - asUtc;
      }
      return new Date(t);
    }

    function nextBrief0700(from) {
      const p = denverParts(from);
      if (p.hour < 7) {
        return denverWallTime(p.year, p.month, p.day, 7, 0, 0);
      }
      // tomorrow 07:00 MT
      const tomorrow = new Date(from.getTime() + 24 * 60 * 60 * 1000);
      // walk forward until Denver calendar day advances
      let probe = from;
      const todayKey = denverDateKey(from);
      for (let i = 0; i < 50; i++) {
        probe = new Date(probe.getTime() + 60 * 60 * 1000);
        if (denverDateKey(probe) !== todayKey) break;
      }
      const n = denverParts(probe);
      return denverWallTime(n.year, n.month, n.day, 7, 0, 0);
    }

    function fmtClockTime(date, withDate) {
      const opts = {
        timeZone: 'America/Denver',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      };
      if (withDate) {
        opts.month = 'short';
        opts.day = 'numeric';
      }
      return date.toLocaleString('en-US', opts) + ' MT';
    }

    function parseWatchTime(w) {
      if (!w || !w.time) return null;
      const t = new Date(w.time);
      if (!isFinite(t.getTime())) return null;
      return t;
    }

    function nextWatchAt(w, now) {
      const watchTime = parseWatchTime(w);
      if (!watchTime) return null;
      const hour = denverHour();
      // Night [23:00, 07:00) → next 07:00 MT
      if (hour >= 23 || hour < 7) {
        return nextBrief0700(now);
      }
      const candidateA = new Date(watchTime.getTime() + 6 * 60 * 60 * 1000);
      const candidateB = nextBrief0700(now);
      return candidateA.getTime() <= candidateB.getTime() ? candidateA : candidateB;
    }

    function renderClock(w) {
      const now = new Date();
      document.getElementById('clockNow').textContent = fmtClockTime(now, false);
      document.getElementById('clockBrief').textContent = 'BRIEF 07:00 MT';
      const nextEl = document.getElementById('clockNext');
      const nextAt = nextWatchAt(w, now);
      if (!nextAt) {
        nextEl.hidden = true;
        nextEl.textContent = '';
        if (typeof refreshWallZoomIfOpen === 'function') refreshWallZoomIfOpen('clock');
        return;
      }
      const withDate = denverDateKey(nextAt) !== denverDateKey(now);
      nextEl.hidden = false;
      nextEl.textContent = 'NEXT WATCH ' + fmtClockTime(nextAt, withDate);
      if (typeof refreshWallZoomIfOpen === 'function') refreshWallZoomIfOpen('clock');
    }

    function startClockLoop() {
      renderClock(watch);
      window.setInterval(() => { renderClock(watch); }, 30000);
    }

    function seatStamp(seat, data) {
      if (seat === 'dev') {
        return (data && (data.updated || data.pushed_at))
          || (deploy && deploy.pushed_at)
          || null;
      }
      return data && data.updated;
    }

    function applySeatStatus(seat, data) {
      const working = isWorking(seatStamp(seat, data));
      const btn = document.getElementById('desk-' + seat);
      const status = document.getElementById('status-' + seat);
      if (btn.classList.contains('empty')) {
        btn.classList.remove('working', 'away', 'walking');
        status.textContent = 'empty';
        return;
      }
      if (btn.classList.contains('away')) {
        btn.classList.remove('working');
        status.textContent = 'away';
        return;
      }
      if (working) {
        btn.classList.add('working');
        status.textContent = 'working';
      } else {
        btn.classList.remove('working');
        status.textContent = 'idle';
      }
    }

    function traderIsSeated(t) {
      if (!t || typeof t !== 'object') return false;
      return !!(t.time || t.event);
    }

    function latestJournalClose(j) {
      const entries = journalEntries(j);
      for (let i = entries.length - 1; i >= 0; i--) {
        const e = entries[i];
        if (e && String(e.type || '').toUpperCase() === 'CLOSE') return e;
      }
      return null;
    }

    function latestJournalOpenOrFill(j) {
      // PAPER OPEN / FILL is not a CALL. Prefer OPEN entries for last fill display.
      const entries = journalEntries(j);
      for (let i = entries.length - 1; i >= 0; i--) {
        const e = entries[i];
        const t = e && String(e.type || '').toUpperCase();
        if (t === 'OPEN' || t === 'CLOSE') return e;
      }
      return null;
    }

    function applyTraderDesk() {
      const btn = document.getElementById('desk-trader');
      const status = document.getElementById('status-trader');
      if (!btn || !status) return;
      // Night: empty until Trader has an explicit night seat rule. Day: seat from trader.json.
      if (!traderIsSeated(trader) || isNightDenver()) {
        btn.classList.add('empty');
        btn.classList.remove('working', 'away', 'walking');
        status.textContent = 'empty';
        return;
      }
      btn.classList.remove('empty', 'away');
      if (trader.status === 'working') {
        btn.classList.add('working');
        status.textContent = 'working';
      } else {
        btn.classList.remove('working');
        status.textContent = 'idle';
      }
    }

    function buildTapeMarquee(w) {
      const names = (w && w.names) || [];
      if (!names.length) return 'NO NAMES';
      // ticker text ONLY from watch.json names/flags — no invented prices/P&L
      const parts = names.map(n => {
        const flag = n.flag ? ` [${n.flag}]` : '';
        return `${n.ticker}${flag}`;
      });
      return parts.join('   ·   ') + '   ·   ';
    }

    function setTape(w) {
      const text = buildTapeMarquee(w);
      const track = document.getElementById('tapeTrack');
      // Rebuild two identical children so translateX(-50%) loops seamlessly
      track.innerHTML = '';
      for (let i = 0; i < 2; i++) {
        const span = document.createElement('span');
        span.className = 'tape-copy';
        span.textContent = text;
        track.appendChild(span);
      }
      track.style.animation = 'none';
      void track.offsetWidth;
      track.style.animation = '';
    }

    /* ——— motion: night away + occasional desk→tape→desk walks ——— */
    const WALK_DURATION_MS = 5000;
    const WALK_FIRST_MIN_MS = 5 * 1000;
    const WALK_FIRST_MAX_MS = 10 * 1000;
    const WALK_GAP_MIN_MS = 60 * 1000;
    const WALK_GAP_MAX_MS = 90 * 1000;
    let walkerBusy = false;
    let walkTimer = null;

    function denverHour() {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Denver',
        hour: 'numeric',
        hourCycle: 'h23'
      }).formatToParts(new Date());
      const h = parts.find(p => p.type === 'hour');
      return parseInt(h && h.value, 10) % 24;
    }

    function isNightDenver() {
      const h = denverHour();
      return h >= 23 || h < 7;
    }

    function isStandDownOrHalt() {
      return (watch && watch.stand_down === true) || (journal && journal.halt === true);
    }

    function applyNightAway() {
      // 23:00–07:00 MT: Scout/Chief/Steno leave — empty chairs (not dimmed away).
      // Dev stays only if recent push (<2h). Trader handled in applyTraderDesk (empty at night).
      const night = isNightDenver();
      SEATS.forEach(seat => {
        const btn = document.getElementById('desk-' + seat);
        const status = document.getElementById('status-' + seat);
        if (!btn || !status) return;
        if (night) {
          if (seat === 'dev' && isWorking(seatStamp('dev', seatData.dev))) {
            btn.classList.remove('empty', 'away');
            applySeatStatus(seat, seatData[seat]);
          } else {
            btn.classList.add('empty');
            btn.classList.remove('away', 'working', 'walking');
            status.textContent = 'empty';
          }
        } else {
          btn.classList.remove('empty', 'away');
          applySeatStatus(seat, seatData[seat]);
        }
      });
      applyTraderDesk();
    }

    function eligibleWalkers() {
      if (walkerBusy || isStandDownOrHalt()) return [];
      // Scout / Chief / Steno / Dev + seated Trader (never open)
      const pool = SEATS.slice();
      if (traderIsSeated(trader)) pool.push('trader');
      return pool.filter(seat => {
        const btn = document.getElementById('desk-' + seat);
        return btn
          && !btn.classList.contains('empty')
          && !btn.classList.contains('away')
          && !btn.classList.contains('walking');
      });
    }

    function randBetween(minMs, maxMs) {
      return minMs + Math.floor(Math.random() * (maxMs - minMs + 1));
    }

    function startWalk() {
      applyNightAway();
      const eligible = eligibleWalkers();
      if (!eligible.length) return;
      // One worker only — never all four at once
      const seat = eligible[Math.floor(Math.random() * eligible.length)];
      const btn = document.getElementById('desk-' + seat);
      walkerBusy = true;
      btn.classList.add('walking');
      window.setTimeout(() => {
        btn.classList.remove('walking');
        walkerBusy = false;
      }, WALK_DURATION_MS);
    }

    function scheduleNextWalk(minMs, maxMs) {
      if (walkTimer) clearTimeout(walkTimer);
      walkTimer = window.setTimeout(() => {
        startWalk();
        scheduleNextWalk(WALK_GAP_MIN_MS, WALK_GAP_MAX_MS);
      }, randBetween(minMs, maxMs));
    }

    function startMotionLoop() {
      applyNightAway();
      // First walk 5–10s after open so a visitor sees motion; then every 60–90s
      scheduleNextWalk(WALK_FIRST_MIN_MS, WALK_FIRST_MAX_MS);
    }

    function watchHasLane(w) {
      if (!w) return false;
      if (w.lane != null && w.lane !== '') return true;
      return (w.names || []).some(n => n && n.lane != null && n.lane !== '');
    }

    function journalEntryCardHtml(e) {
      if (!e || typeof e !== 'object') return '';
      const typ = String(e.type || 'LOG').toUpperCase();
      const when = fmtMT(e.time) || '—';
      const names = Array.isArray(e.names) ? e.names.filter(Boolean) : [];
      let html = `<li class="journal-entry">`;
      html += `<div class="journal-meta"><span class="journal-type">${esc(publicEntryType(typ))}</span><span>${esc(when)}</span></div>`;
      if (names.length) {
        html += `<p class="journal-names">${esc(names.join(', '))}</p>`;
      }
      if (e.note) {
        html += `<p class="journal-note">${esc(e.note)}</p>`;
      }
      if (typ === 'CLOSE' && e.pnl_usd != null && e.pnl_usd !== '') {
        html += `<p class="journal-pnl">P&amp;L ${esc(fmtPnlUsd(toPnlNumber(e.pnl_usd)))}</p>`;
      }
      html += `<p class="journal-nfa">not a call · nfa</p>`;
      html += `</li>`;
      return html;
    }

    function renderRecentJournal(j) {
      const root = document.getElementById('recentJournal');
      if (!root) return;
      const entries = journalEntries(j).slice();
      if (!entries.length) {
        root.innerHTML = `<p class="journal-empty">No journal entries yet.</p>`;
        return;
      }
      entries.sort((a, b) => {
        const ta = Date.parse(a && a.time) || 0;
        const tb = Date.parse(b && b.time) || 0;
        return tb - ta;
      });
      const last3 = entries.slice(0, 3);
      root.innerHTML = `<ul class="journal-list">${last3.map(journalEntryCardHtml).join('')}</ul>`;
    }


    function tickerCellHtml(n) {
      // Watch table link: DexScreener pair URL if present; else Solscan mint.
      // Never invent a mint — plain text ticker if mint missing.
      const pair = n.pair_url || n.dexscreener_url || n.dexscreener || n.pair || null;
      const mint = n.mint || n.token_mint || null;
      const label = esc(n.ticker || '');
      if (pair && typeof pair === 'string' && /^https?:\/\//i.test(pair)) {
        return `<a href="${esc(pair)}" rel="noopener noreferrer" target="_blank">${label}</a>`;
      }
      if (mint && typeof mint === 'string' && mint.trim()) {
        const m = mint.trim();
        // only link real-looking base58 mints already provided — do not invent
        if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(m)) {
          return `<a href="https://solscan.io/token/${esc(m)}" rel="noopener noreferrer" target="_blank">${label}</a>`;
        }
      }
      return label;
    }

    function renderV1(w) {
      const t = new Date(w.time);
      document.getElementById('meta').textContent =
        `WATCH · ${t.toLocaleString('en-US', {
          timeZone: 'America/Denver',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        })} MT`
        + (w.liquid_tape_day ? ' · liquid tape day' : '');

      const tape = w.tape || {};
      const sol = tape.SOL_24h_pct;
      const btc = tape.BTC_24h_pct;
      document.getElementById('tape').textContent =
        `SOL ${sol >= 0 ? '+' : ''}${sol}% · BTC ${btc >= 0 ? '+' : ''}${btc}% (${tape.source || ''})`;

      const showLane = watchHasLane(w);
      const thead = document.querySelector('.card table thead tr');
      if (thead) {
        thead.innerHTML = showLane
          ? '<th>Name</th><th>mc</th><th>vol</th><th>Lane</th><th>flag</th>'
          : '<th>Name</th><th>mc</th><th>vol</th><th>flag</th>';
      }
      const cols = showLane ? 5 : 4;
      const rows = (w.names || []).map(n => {
        const laneCell = showLane
          ? `<td>${esc(n.lane != null && n.lane !== '' ? n.lane : (w.lane || '—'))}</td>`
          : '';
        return `<tr><td>${tickerCellHtml(n)}</td><td>mc ${fmt(n.mcap)}</td><td>vol ${fmt(n.vol24)}</td>${laneCell}<td class="flag">${esc(n.flag || '')}</td></tr>`;
      }).join('');
      document.getElementById('names').innerHTML =
        rows || `<tr><td colspan="${cols}" class="err">No names in watch.json</td></tr>`;

      const stand = document.getElementById('stand');
      if (w.stand_down) {
        stand.innerHTML = `<span class="stand">stand-down · ${esc(w.stand_down_why || 'yes')}</span>`;
      } else {
        stand.innerHTML = `<span class="stand">stand-down no</span>`;
      }

      const disc = w.disclaimer || 'not a call · nfa';
      document.getElementById('disclaimer').textContent = disc;
      document.getElementById('disclaimerTop').textContent = disc;
    }

    function statusLine(seat) {
      const btn = document.getElementById('desk-' + seat);
      if (btn && btn.classList.contains('away')) return 'Away';
      return isWorking(seatStamp(seat, seatData[seat])) ? 'Working' : 'Idle';
    }

    function disclaimerHtml() {
      const d = (watch && watch.disclaimer) || (journal && journal.disclaimer) || 'not a call · nfa';
      return `<p class="disclaimer">${esc(d)}</p>`;
    }

    async function loadXcard() {
      if (xcardText) return xcardText;
      try {
        const r = await fetch('./xcard.txt', { cache: 'no-store' });
        xcardText = r.ok ? await r.text() : '';
      } catch (e) {
        xcardText = '';
      }
      return xcardText;
    }

    function formatJournalLine(e) {
      if (!e || typeof e !== 'object') return '—';
      const typ = String(e.type || 'LOG').toUpperCase();
      const when = fmtMT(e.time) || '—';
      const parts = [publicEntryType(typ), when];
      const names = Array.isArray(e.names) ? e.names.filter(Boolean) : [];
      if (names.length === 1) parts.push(String(names[0]));
      else if (names.length > 1) parts.push(names.length + ' names');
      if (e.lane) parts.push(String(e.lane));
      if (typ === 'CLOSE' && e.pnl_usd != null && e.pnl_usd !== '') {
        parts.push(fmtPnlUsd(toPnlNumber(e.pnl_usd)));
      }
      if (e.note) parts.push(String(e.note));
      return parts.join(' · ');
    }

    async function openPanel(seat) {
      const panel = document.getElementById('deskPanel');
      const title = document.getElementById('panelTitle');
      const body = document.getElementById('panelBody');
      title.textContent = SEAT_TITLES[seat] || seat;

      const w = watch || {};
      const j = journal || {};
      let html = '';

      if (seat === 'trader') {
        if (!traderIsSeated(trader)) {
          html = `<p class="panel-line">awaiting trader.</p>`;
        } else {
          const btn = document.getElementById('desk-trader');
          if (btn && btn.classList.contains('away')) {
            html = `<p class="panel-status">Away</p>`;
          } else {
            const st = trader.status === 'working' ? 'working' : 'idle';
            html = `<p class="panel-status">${st === 'working' ? 'Working' : 'Idle'}</p>`;
            html += `<p class="panel-line">Status: ${esc(st)}</p>`;
          }
          if (trader.status === 'working' && trader.open_ticket) {
            html += `<p class="panel-line">PAPER OPEN on ${esc(trader.open_ticket)}${trader.pair ? ' ' + esc(String(trader.pair).split('/')[0]) : ''}</p>`;
          }
          const fill = latestJournalOpenOrFill(j);
          if (fill) {
            html += `<p class="panel-line">Last fill: ${esc(formatJournalLine(fill))}</p>`;
          } else if (trader.fill_time || trader.fill_usd != null) {
            html += `<p class="panel-line">Last fill: ${esc(trader.pair || '—')} · ${esc(trader.fill_usd != null ? String(trader.fill_usd) : '—')}</p>`;
          } else {
            html += `<p class="panel-line">Last fill: none</p>`;
          }
          html += `<p class="panel-line">paper only.</p>`;
          if (trader.open_ticket) {
            html += `<p class="panel-line">Open ticket: ${esc(trader.open_ticket)}</p>`;
          }
          if (trader.pair) {
            html += `<p class="panel-line">Pair: ${esc(trader.pair)}</p>`;
          }
          if (trader.note) {
            html += `<p class="panel-line">Note: ${esc(trader.note)}</p>`;
          }
          html += disclaimerHtml();
        }
      } else if (seat === 'open') {
        html = `<p class="panel-line">unused.</p>`;
      } else {
        html = `<p class="panel-status">${statusLine(seat)}</p>`;

        if (seat === 'scout') {
          const when = fmtMT(w.time);
          html += `<p class="panel-line">Watch time · ${esc(when || '—')}</p>`;
          const names = w.names || [];
          if (names.length) {
            html += `<ul class="panel-names">`;
            names.forEach(n => {
              const flag = humanFlag(n.flag);
              html += `<li>${esc(n.ticker)} · mc ${fmt(n.mcap)} · vol ${fmt(n.vol24)}${flag ? ' · ' + esc(flag) : ''}</li>`;
            });
            html += `</ul>`;
          }
        } else if (seat === 'chief') {
          html += `<p class="panel-line">Paper P&L: ${esc(fmtPnlUsd(journalPaperPnl(j)))}</p>`;
          html += `<p class="panel-line">Live P&L: ${esc(fmtPnlUsd(journalLivePnl(j)))}</p>`;
          const entries = journalEntries(j).slice().reverse();
          if (entries.length) {
            html += `<div class="panel-section"><h3>Journal</h3><ul class="panel-names">`;
            entries.forEach(e => {
              html += `<li>${esc(formatJournalLine(e))}</li>`;
            });
            html += `</ul></div>`;
          } else {
            html += `<p class="panel-line">No journal entries yet.</p>`;
          }
        } else if (seat === 'steno') {
          const card = await loadXcard();
          html += `<div class="panel-section"><h3>Last X card</h3>`;
          html += `<pre class="xcard">${esc(card)}</pre></div>`;
        } else if (seat === 'dev') {
          const pushed = (deploy && deploy.pushed_at) || (seatData.dev && seatData.dev.pushed_at);
          html += `<p class="panel-line"><a href="https://github.com/tapefloordev/tapefloor" rel="noopener noreferrer">https://github.com/tapefloordev/tapefloor</a></p>`;
          html += `<p class="panel-line">Last push: ${esc(fmtMT(pushed) || '—')}</p>`;
        }

        html += disclaimerHtml();
      }

      body.innerHTML = html;
      panel.classList.add('open');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closePanel() {
      document.getElementById('deskPanel').classList.remove('open');
    }

    /* ——— Wall zoom (TV / Board / Clock) ——— */
    let wallZoomKind = null;

    function wallZoomIsOpen() {
      const el = document.getElementById('wallZoom');
      return el && !el.hidden;
    }

    function buildWallZoomHtml(kind) {
      if (kind === 'tv') {
        const paper = document.getElementById('tvPaper').textContent;
        const live = document.getElementById('tvLive').textContent;
        const eq = document.getElementById('tvEquity');
        let html = `<p class="panel-line wall-zoom-line">${esc(paper)}</p>`;
        if (eq && eq.childNodes.length) {
          html += `<div class="tv-equity wall-zoom-equity">${eq.outerHTML}</div>`;
        }
        html += `<p class="panel-line wall-zoom-line">${esc(live)}</p>`;
        return html;
      }
      if (kind === 'board') {
        const items = [...document.querySelectorAll('#whiteboardLines li')].map(li => {
          const k = li.querySelector('.wb-k');
          const v = li.querySelector('.wb-v');
          const left = k ? k.textContent : '';
          const right = v ? v.textContent : li.textContent;
          return `<li><span class="wb-k">${esc(left)}</span><span class="wb-v">${esc(right)}</span></li>`;
        }).join('');
        return `<ul class="wb-lines wall-zoom-wb">${items}</ul>`;
      }
      if (kind === 'clock') {
        const now = document.getElementById('clockNow').textContent;
        const nextEl = document.getElementById('clockNext');
        const brief = document.getElementById('clockBrief').textContent;
        let html = `<p class="panel-line wall-zoom-line">${esc(now)}</p>`;
        if (nextEl && !nextEl.hidden && nextEl.textContent) {
          html += `<p class="panel-line wall-zoom-line">${esc(nextEl.textContent)}</p>`;
        }
        html += `<p class="panel-line wall-zoom-line">${esc(brief)}</p>`;
        return html;
      }
      return '';
    }

    function fillWallZoom(kind) {
      const titles = { tv: 'TV', board: 'Board', clock: 'Clock' };
      document.getElementById('wallZoomTitle').textContent = titles[kind] || kind;
      document.getElementById('wallZoomBody').innerHTML = buildWallZoomHtml(kind);
    }

    function openWallZoom(kind) {
      wallZoomKind = kind;
      fillWallZoom(kind);
      const el = document.getElementById('wallZoom');
      el.hidden = false;
      el.classList.add('open');
      document.getElementById('wallZoomClose').focus();
    }

    function closeWallZoom() {
      const el = document.getElementById('wallZoom');
      el.hidden = true;
      el.classList.remove('open');
      wallZoomKind = null;
    }

    function refreshWallZoomIfOpen(kind) {
      if (wallZoomIsOpen() && wallZoomKind === kind) fillWallZoom(kind);
    }

    document.getElementById('wallZoomClose').addEventListener('click', closeWallZoom);
    document.getElementById('wallZoomBackdrop').addEventListener('click', closeWallZoom);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && wallZoomIsOpen()) {
        e.preventDefault();
        closeWallZoom();
      }
    });

    document.querySelectorAll('.wall-clickable').forEach(el => {
      el.addEventListener('click', () => { openWallZoom(el.dataset.wall); });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openWallZoom(el.dataset.wall);
        }
      });
    });

    document.getElementById('panelClose').addEventListener('click', closePanel);
    SEATS.forEach(seat => {
      document.getElementById('desk-' + seat).addEventListener('click', () => { openPanel(seat); });
    });
    EMPTY_DESKS.forEach(seat => {
      document.getElementById('desk-' + seat).addEventListener('click', () => { openPanel(seat); });
    });

    Promise.all([
      fetch('./watch.json', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('watch.json ' + r.status);
        return r.json();
      }),
      fetch('./journal.json', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('journal.json ' + r.status);
        return r.json();
      }),
      fetch('./xcard.txt', { cache: 'no-store' })
        .then(r => (r.ok ? r.text() : ''))
        .catch(() => ''),
      fetch('./deploy.json', { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null),
      fetch('./trader.json', { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null),
      ...SEATS.map(seat =>
        fetch(`./seats/${seat}.json`, { cache: 'no-store' })
          .then(r => (r.ok ? r.json() : { updated: null }))
          .catch(() => ({ updated: null }))
          .then(d => { seatData[seat] = d; })
      )
    ])
      .then(([w, j, xcard, dep, tr]) => {
        watch = w;
        journal = j;
        xcardText = xcard || '';
        deploy = dep;
        trader = tr;

        // Halt lamp: ON iff journal.halt===true OR watch.stand_down===true
        setHalt(j.halt === true || w.stand_down === true);
        renderWhiteboard(j, w);
        renderTv(j);
        startClockLoop();

        setTape(w);

        SEATS.forEach(seat => applySeatStatus(seat, seatData[seat]));
        applyTraderDesk();
        applyNightAway();
        startMotionLoop();
        renderV1(w);
        renderRecentJournal(j);
      })
      .catch(e => {
        document.getElementById('meta').innerHTML = `<span class="err">Failed to load watch.json / journal.json</span>`;
        console.error(e);
      });
  </script>
</body>
</html>
