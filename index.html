<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tape Floor</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d10; --fg:#e8eaed; --muted:#9aa0a6; --line:#2a2f36; --accent:#7dd3a7; }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 1.15rem; letter-spacing: .06em; margin: 0 0 .35rem; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.15rem; }
    .meta { color: var(--muted); font-size:.9rem; margin-bottom:.75rem; }
    .tape { margin: 0 0 1rem; }
    table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align:left; padding:.4rem 0; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; }
    .flag { color: var(--accent); }
    .disclaimer { margin: 1rem 0 0; color: var(--muted); font-size:.9rem; }
    .stand { display:inline-block; margin-top:.5rem; padding:.25rem .6rem; border:1px solid var(--line); border-radius:999px; font-size:.8rem; color:var(--muted); }
    .err { color:#f0a0a0; }
  </style>
</head>
<body>
  <main>
    <h1>TAPE FLOOR</h1>
    <p class="sub"><a href="https://x.com/tapefloor1000x" rel="noopener noreferrer">@tapefloor1000x</a></p>
    <div class="card">
      <div class="meta" id="meta">Loading…</div>
      <div class="tape" id="tape"></div>
      <table>
        <thead><tr><th>Name</th><th>mc</th><th>vol</th><th>flag</th></tr></thead>
        <tbody id="names"></tbody>
      </table>
      <div id="stand"></div>
      <p class="disclaimer" id="disclaimer">not a call · nfa</p>
    </div>
  </main>
  <script>
    const fmt = n => {
      if (typeof n !== 'number' || !isFinite(n)) return '—';
      if (n >= 1e9) return `$${(n/1e9).toFixed(1)}B`;
      if (n >= 1e6) return `$${(n/1e6).toFixed(1)}M`;
      if (n >= 1e3) return `$${(n/1e3).toFixed(0)}K`;
      return `$${n}`;
    };
    fetch('./watch.json', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('watch.json ' + r.status);
        return r.json();
      })
      .then(w => {
        const t = new Date(w.time);
        document.getElementById('meta').textContent =
          `WATCH · ${t.toLocaleString('en-US', { timeZone: 'America/Denver', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true })} MT`
          + (w.liquid_tape_day ? ' · liquid tape day' : '');
        const tape = w.tape || {};
        const sol = tape.SOL_24h_pct;
        const btc = tape.BTC_24h_pct;
        document.getElementById('tape').textContent =
          `SOL ${sol >= 0 ? '+' : ''}${sol}% · BTC ${btc >= 0 ? '+' : ''}${btc}% (${tape.source || ''})`;
        const rows = (w.names || []).map(n =>
          `<tr><td>${n.ticker}</td><td>mc ${fmt(n.mcap)}</td><td>vol ${fmt(n.vol24)}</td><td class="flag">${n.flag || ''}</td></tr>`
        ).join('');
        document.getElementById('names').innerHTML = rows || '<tr><td colspan="4" class="err">No names in watch.json</td></tr>';
        const stand = document.getElementById('stand');
        if (w.stand_down) {
          stand.innerHTML = `<span class="stand">stand-down · ${w.stand_down_why || 'yes'}</span>`;
        } else {
          stand.innerHTML = `<span class="stand">stand-down no</span>`;
        }
        document.getElementById('disclaimer').textContent = w.disclaimer || 'not a call · nfa';
      })
      .catch(e => {
        document.getElementById('meta').innerHTML = `<span class="err">Failed to load watch.json</span>`;
        console.error(e);
      });
  </script>
</body>
</html>
