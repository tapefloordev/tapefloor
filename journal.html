<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tape Floor</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/site.css" />
</head>
<body class="site-page">
  <div class="wrap">
    <header class="site">
      <h1>TAPE FLOOR</h1>
      <nav class="links" aria-label="External">
        <a href="https://x.com/tapefloor1000x" rel="noopener noreferrer">@tapefloor1000x</a>
        <a href="https://github.com/tapefloordev/tapefloor" rel="noopener noreferrer">github</a>
      </nav>
    </header>

    <nav class="page-nav" aria-label="Site">
      <a href="./index.html">Floor</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="./journal.html" aria-current="page">Journal</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="./how.html">How</a>
    </nav>

    <p class="disclaimer-bar">not a call · nfa</p>
    <h2 class="page-title">Journal</h2>

    <div class="card">
      <div id="journalRoot"><p class="journal-empty">Loading…</p></div>
    </div>
  </div>

  <script>
    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    function fmtMT(iso) {
      if (!iso) return '—';
      const t = new Date(iso);
      if (!isFinite(t.getTime())) return '—';
      return t.toLocaleString('en-US', {
        timeZone: 'America/Denver',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }) + ' MT';
    }

    function fmtPnlUsd(n) {
      const v = typeof n === 'number' && isFinite(n) ? n : Number(n);
      if (!isFinite(v)) return null;
      const abs = Math.abs(v);
      const body = abs.toLocaleString('en-US', {
        minimumFractionDigits: abs < 1 ? 2 : 0,
        maximumFractionDigits: abs < 1 ? 4 : 2
      });
      return (v < 0 ? '-$' : '+$') + body;
    }

    function fmtPnlSol(n) {
      const v = typeof n === 'number' && isFinite(n) ? n : Number(n);
      if (!isFinite(v)) return null;
      const sign = v < 0 ? '' : '+';
      return sign + v.toFixed(6) + ' SOL';
    }

    function fmtPx(n) {
      const v = typeof n === 'number' && isFinite(n) ? n : Number(n);
      if (!isFinite(v)) return null;
      if (v === 0) return '0';
      if (v < 0.0001) return v.toExponential(3);
      return String(v);
    }

    function publicEntryType(typ) {
      const t = String(typ || 'LOG').toUpperCase();
      if (t === 'PASS' || t === 'SKIP') return 'Skipped';
      if (t === 'CALL') return 'Called';
      if (t === 'WATCH') return 'Watch';
      if (t === 'BRIEF') return 'Brief';
      if (t === 'DRAFT') return 'Draft';
      if (t === 'OPEN') return 'Paper open';
      if (t === 'CLOSE') return 'Close';
      return t.charAt(0) + t.slice(1).toLowerCase();
    }

    function looksLikeMint(m) {
      if (!m || typeof m !== 'string') return false;
      const s = m.trim();
      // Solana base58 pubkey-ish; reject placeholders
      if (s.length < 32 || s.length > 52) return false;
      if (/missing|unknown|null|undefined|n\/a/i.test(s)) return false;
      return /^[1-9A-HJ-NP-Za-km-z]+$/.test(s);
    }

    function pairAddressFromUrl(url) {
      if (!url || typeof url !== 'string') return null;
      const m = url.trim().match(/dexscreener\.com\/solana\/([a-zA-Z0-9]+)/i);
      return m ? m[1] : null;
    }

    function dexEmbedUrl(pairUrl) {
      const addr = pairAddressFromUrl(pairUrl);
      if (!addr) return null;
      return 'https://dexscreener.com/solana/' + addr + '?embed=1&loadChartSettings=0&trades=0&tabs=0&info=0&chartLeftToolbar=0&chartTheme=dark&theme=dark&chartStyle=0&chartType=usd&interval=15';
    }

    function parseNoteField(note, re) {
      if (!note) return null;
      const m = String(note).match(re);
      return m ? m[1].trim() : null;
    }

    function indexByTicket(entries) {
      const openByTicket = {};
      const draftByTicket = {};
      (entries || []).forEach(e => {
        if (!e || !e.ticket_id) return;
        const t = String(e.type || '').toUpperCase();
        if (t === 'OPEN' && !openByTicket[e.ticket_id]) openByTicket[e.ticket_id] = e;
        // prefer TICKET-prefixed OPEN note when duplicates
        if (t === 'OPEN' && /TICKET\s+/.test(e.note || '')) openByTicket[e.ticket_id] = e;
        if (t === 'DRAFT') draftByTicket[e.ticket_id] = e;
      });
      return { openByTicket, draftByTicket };
    }

    function ticketsById(payload) {
      const map = {};
      if (!payload || typeof payload !== 'object') return map;
      const raw = payload.tickets || payload.entries || payload;
      if (Array.isArray(raw)) {
        raw.forEach(t => {
          const id = t && (t.ticket_id || t.id);
          if (id) map[String(id)] = t;
        });
      } else if (raw && typeof raw === 'object') {
        Object.keys(raw).forEach(id => { map[String(id)] = raw[id]; });
      }
      return map;
    }

    function pickTicketField(ticket, entry, draft, open, key) {
      const chain = [ticket, entry, draft, open];
      for (const src of chain) {
        if (!src) continue;
        const v = src[key];
        if (v != null && String(v).trim() !== '') return String(v).trim();
      }
      return '';
    }

    function closeCardHtml(e, ctx) {
      const ticker = (Array.isArray(e.names) && e.names[0]) ? String(e.names[0]) : '—';
      const lane = e.lane ? String(e.lane) : '—';
      const tid = e.ticket_id ? String(e.ticket_id) : null;
      const open = tid && ctx.openByTicket[tid] ? ctx.openByTicket[tid] : null;
      const draft = tid && ctx.draftByTicket[tid] ? ctx.draftByTicket[tid] : null;

      const ticket = tid && ctx.tickets && ctx.tickets[tid] ? ctx.tickets[tid] : null;
      const whyRaw = pickTicketField(ticket, e, draft, open, 'why');
      const wrongRaw = pickTicketField(ticket, e, draft, open, 'wrong_if');

      const fillFromNote = parseNoteField(open && open.note, /FILL\s+([0-9.eE+-]+)/i)
        || parseNoteField(e.note, /fill\s+([0-9.eE+-]+)/i);
      const exitFromNote = parseNoteField(e.note, /EXIT\s+([0-9.eE+-]+)/i);
      const reason = parseNoteField(e.note, /reason\s+([^·\n]+)/i) || e.reason || null;

      const fillPx = e.fill_usd != null ? e.fill_usd : (fillFromNote != null ? Number(fillFromNote) : null);
      const exitPx = e.exit_usd != null ? e.exit_usd : (exitFromNote != null ? Number(exitFromNote) : null);

      const openTime = open && open.time ? open.time : null;
      const closeTime = e.time || null;

      let html = `<li class="journal-entry journal-close">`;
      html += `<div class="journal-meta"><span class="journal-type">Close</span>`;
      if (tid) html += `<span class="journal-ticket">${esc(tid)}</span>`;
      html += `</div>`;
      html += `<p class="journal-head"><span class="journal-ticker">$${esc(ticker)}</span>`;
      html += ` <span class="journal-lane">${esc(lane)}</span></p>`;
      html += `<p class="journal-times">open ${esc(fmtMT(openTime))} · close ${esc(fmtMT(closeTime))}</p>`;

      html += `<p class="journal-label">WHY</p>`;
      html += whyRaw
        ? `<p class="journal-why">${esc(whyRaw)}</p>`
        : `<p class="journal-why journal-missing">why missing</p>`;

      html += `<p class="journal-label">WRONG IF</p>`;
      html += wrongRaw
        ? `<p class="journal-wrong">${esc(wrongRaw)}</p>`
        : `<p class="journal-wrong journal-missing">wrong if missing</p>`;

      const fillS = fmtPx(fillPx);
      const exitS = fmtPx(exitPx);
      const pnlSol = fmtPnlSol(e.pnl_sol);
      const pnlUsd = fmtPnlUsd(e.pnl_usd);
      let trade = '';
      if (fillS && exitS) trade += `${esc(fillS)} → ${esc(exitS)}`;
      else if (exitS) trade += `exit ${esc(exitS)}`;
      else if (fillS) trade += `fill ${esc(fillS)}`;
      if (pnlSol || pnlUsd) {
        trade += (trade ? ' · ' : '') + 'pnl ' + esc([pnlSol, pnlUsd].filter(Boolean).join(' / '));
      }
      if (reason) trade += (trade ? ' · ' : '') + esc(reason);
      if (trade) html += `<p class="journal-trade">${trade}</p>`;

      const mint = pickTicketField(ticket, e, draft, open, 'mint') || null;
      const pairUrl = pickTicketField(ticket, e, draft, open, 'exit_url')
        || pickTicketField(ticket, e, draft, open, 'pair_url')
        || null;
      const mintOk = looksLikeMint(mint);
      const embed = mintOk ? dexEmbedUrl(pairUrl) : null;

      if (tid && mintOk) {
        const shot = `./assets/tickets/${encodeURIComponent(tid)}.png`;
        html += `<div class="journal-dex" data-ticket="${esc(tid)}">`;
        html += `<img class="journal-dex-shot" src="${esc(shot)}" alt="$${esc(ticker)} chart" loading="lazy" />`;
        if (embed) {
          html += `<iframe class="journal-dex-embed" title="$${esc(ticker)} DexScreener" src="${esc(embed)}" loading="lazy" allow="clipboard-write" allowfullscreen></iframe>`;
        }
        html += `</div>`;
      } else if (!mintOk) {
        html += `<p class="journal-dex-skip">no chart (mint missing or invalid)</p>`;
      } else if (embed) {
        html += `<div class="journal-dex"><iframe class="journal-dex-embed only" title="$${esc(ticker)} DexScreener" src="${esc(embed)}" loading="lazy" allow="clipboard-write" allowfullscreen></iframe></div>`;
      }

      html += `<p class="journal-nfa">not a call · nfa</p>`;
      html += `</li>`;
      return html;
    }

    function entryHtml(e, ctx) {
      if (!e || typeof e !== 'object') return '';
      const typ = String(e.type || 'LOG').toUpperCase();
      if (typ === 'CLOSE') return closeCardHtml(e, ctx);

      const when = fmtMT(e.time);
      const names = Array.isArray(e.names) ? e.names.filter(Boolean) : [];
      let html = `<li class="journal-entry">`;
      html += `<div class="journal-meta"><span class="journal-type">${esc(publicEntryType(typ))}</span><span>${esc(when)}</span></div>`;
      if (names.length) {
        html += `<p class="journal-names">${esc(names.join(', '))}</p>`;
      }
      if (e.note) {
        html += `<p class="journal-note">${esc(e.note)}</p>`;
      }
      html += `<p class="journal-nfa">not a call · nfa</p>`;
      html += `</li>`;
      return html;
    }

    function wireDexShots(root) {
      root.querySelectorAll('.journal-dex').forEach(box => {
        const img = box.querySelector('.journal-dex-shot');
        const iframe = box.querySelector('.journal-dex-embed');
        if (!img) return;
        const showEmbed = () => {
          img.hidden = true;
          if (iframe) {
            iframe.hidden = false;
            iframe.classList.add('show');
          }
        };
        img.addEventListener('load', () => {
          // prefer saved screenshot when it actually loads
          if (iframe) iframe.hidden = true;
          img.hidden = false;
        });
        img.addEventListener('error', showEmbed);
        // default: hide iframe until we know shot failed; if no shot path, show embed
        if (iframe) iframe.hidden = true;
      });
    }

    function render(j, ticketsPayload) {
      const root = document.getElementById('journalRoot');
      const entries = (j && Array.isArray(j.entries)) ? j.entries.slice() : [];
      if (!entries.length) {
        root.innerHTML = `<p class="journal-empty">No journal entries yet.</p>`;
        return;
      }
      const ctx = indexByTicket(entries);
      ctx.tickets = ticketsById(ticketsPayload);
      entries.sort((a, b) => {
        const ta = Date.parse(a && a.time) || 0;
        const tb = Date.parse(b && b.time) || 0;
        return tb - ta;
      });
      root.innerHTML = `<ul class="journal-list">${entries.map(e => entryHtml(e, ctx)).join('')}</ul>`;
      wireDexShots(root);
    }

    Promise.all([
      fetch('./journal.json', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('journal.json ' + r.status);
        return r.json();
      }),
      fetch('./tickets.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null)
    ])
      .then(([j, tickets]) => render(j, tickets))
      .catch(err => {
        document.getElementById('journalRoot').innerHTML =
          `<p class="journal-empty">Failed to load journal.json</p>`;
        console.error(err);
      });
  </script>
</body>
</html>
